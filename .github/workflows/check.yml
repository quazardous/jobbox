# Every push and every pull request. Two jobs, and the split is
# deliberate: the SUITE runs where its assumptions hold, and the BUILD
# runs everywhere so that a platform breaking is noticed here rather than
# by whoever downloads it.
name: check

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  # The tests drive a shell: `sh -c`, `sleep`, `echo`. That reads like a
  # Unix assumption and mostly is not — the Windows runners ship Git Bash,
  # which provides all three, and jbx itself prefers `bash` wherever it
  # exists. So the suite is tried there too: nobody has ever run this
  # program on Windows (#2065), and a real runner is the cheapest way to
  # stop saying so.
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    # WINDOWS IS ASKED BUT NOT BELIEVED, YET. The suite fails there
    # wholesale today and the README says as much: nobody has run this
    # program on Windows (#2065). A permanently red job is worse than no
    # job — it is where the next real regression goes unnoticed — so the
    # answer is recorded without blocking, and the day it passes the
    # exception comes out.
    continue-on-error: ${{ matrix.os == 'windows-latest' }}
    steps:
      - uses: actions/checkout@v5
      # A PROBE BEFORE THE SUITE, AND ON EVERY PLATFORM so there is
      # something to compare against. Twenty failures on Windows share
      # one shape — the line's own output comes back empty while jbx's
      # announcement prints perfectly — and no runner had ever been
      # asked which shell it picked. `jbx config` answers that; nobody
      # had thought to make it say so where it mattered.
      - name: what jbx sees on this machine
        shell: bash
        run: |
          # NO `set -e` HERE. The point of this step is to WATCH things
          # fail; the shell exiting at the first non-zero hid the very
          # answer it was run to get.
          set +e
          set -x
          cargo build --release
          jbx=target/release/jbx
          [ -f "$jbx.exe" ] && jbx="$jbx.exe"
          export JBX_DIR="$PWD/probe"
          "$jbx" config
          echo "=== a line that must finish in time"
          "$jbx" run -- 'echo bonjour'
          echo "run exit=$?"
          echo "=== the same, detached at once, so its log survives"
          "$jbx" run --after 0 -- 'echo dans-le-journal'
          echo "detached exit=$?"
          sleep 3
          "$jbx" list --json
          echo "=== what is on disk"
          find probe -type f | head -20
          for f in probe/jobs/*.log probe/jobs/*.code probe/jobs/*.json; do
            echo "--- $f"; cat "$f"; echo
          done
          echo "=== the shell, called directly"
          "C:/Program Files/Git/usr/bin/bash.exe" -c 'echo direct-usr-bin'
          echo "direct exit=$?"
          # AND THE SAME LINE THROUGH THE OTHER SHELL. If `cmd /C` fills
          # the log where bash leaves it empty, the fault is in how bash
          # is spawned under a detached parent and not in the redirection
          # itself — two very different repairs.
          echo "=== through cmd instead"
          rm -rf probe
          JBX_SHELL=cmd "$jbx" run --after 0 -- 'echo par-cmd'
          sleep 3
          for f in probe/jobs/*.log probe/jobs/*.code; do echo "--- $f"; cat "$f"; echo; done
          # THE OTHER BASH. `Git\usr\bin\bash.exe` is the raw MSYS
          # binary and `Git\bin\bash.exe` is the launcher meant to be
          # called from a native program. The PATH offers the first, and
          # it dies silently under a detached parent — so the question is
          # whether the second does too. If it does not, the fix is which
          # one we pick; if it does, the fix is how we detach.
          echo "=== through the Git launcher instead"
          rm -rf probe
          JBX_SHELL="C:/Program Files/Git/bin/bash.exe" "$jbx" run --after 0 -- 'echo par-le-lanceur'
          sleep 3
          for f in probe/jobs/*.log probe/jobs/*.code; do echo "--- $f"; cat "$f"; echo; done
          exit 0
      - run: cargo test --release

  # Windows is a declared platform, so it is compiled and linted on every
  # change. This is what catches the `cfg` that only exists on Unix, the
  # path built with a slash, the API that is not there — the failures
  # that would otherwise ship in a release binary nobody could run.
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - run: cargo clippy --release --all-targets -- -D warnings
      - run: cargo build --release
