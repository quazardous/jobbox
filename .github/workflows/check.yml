# Every push and every pull request. Two jobs, and the split is
# deliberate: the SUITE runs where its assumptions hold, and the BUILD
# runs everywhere so that a platform breaking is noticed here rather than
# by whoever downloads it.
name: check

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  # The tests drive a shell: `sh -c`, `sleep`, `echo`. That reads like a
  # Unix assumption and mostly is not — the Windows runners ship Git Bash,
  # which provides all three, and jbx itself prefers `bash` wherever it
  # exists. So the suite is tried there too: nobody has ever run this
  # program on Windows (#2065), and a real runner is the cheapest way to
  # stop saying so.
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    # WINDOWS IS ASKED BUT NOT BELIEVED, YET. The suite fails there
    # wholesale today and the README says as much: nobody has run this
    # program on Windows (#2065). A permanently red job is worse than no
    # job — it is where the next real regression goes unnoticed — so the
    # answer is recorded without blocking, and the day it passes the
    # exception comes out.
    continue-on-error: ${{ matrix.os == 'windows-latest' }}
    steps:
      - uses: actions/checkout@v5
      # A PROBE BEFORE THE SUITE, AND ON EVERY PLATFORM so there is
      # something to compare against. Twenty failures on Windows share
      # one shape — the line's own output comes back empty while jbx's
      # announcement prints perfectly — and no runner had ever been
      # asked which shell it picked. `jbx config` answers that; nobody
      # had thought to make it say so where it mattered.
      - name: what jbx sees on this machine
        shell: bash
        run: |
          set -x
          cargo build --release
          jbx=target/release/jbx
          [ -f "$jbx.exe" ] && jbx="$jbx.exe"
          command -v bash sh || true
          "$jbx" config || true
          # DOES THE CHILD WRITE, OR DOES THE MIRROR LOSE IT? Those are
          # two different bugs and they look identical from here — the
          # caller sees nothing either way. `--after 0` detaches at once,
          # which is the only way to keep a record for a line this short,
          # and `tail` then reads the LOG rather than the mirror.
          "$jbx" run -- 'echo bonjour'; echo "run exit=$?"
          "$jbx" fg -- 'echo salut'; echo "fg exit=$?"
          "$jbx" run --after 0 -- 'echo dans-le-journal'; echo "detached exit=$?"
          "$jbx" list --json || true
          for id in $("$jbx" list --json | grep '"id"' | cut -d'"' -f4); do
            echo "--- log of $id"; "$jbx" tail "$id" || true
          done
      - run: cargo test --release

  # Windows is a declared platform, so it is compiled and linted on every
  # change. This is what catches the `cfg` that only exists on Unix, the
  # path built with a slash, the API that is not there — the failures
  # that would otherwise ship in a release binary nobody could run.
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - run: cargo clippy --release --all-targets -- -D warnings
      - run: cargo build --release
